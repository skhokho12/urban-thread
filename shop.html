<!doctype html>
<!-- shop.html - Product listing loaded from Firestore and client-side filters -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Shop — Urban Threads</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <!-- Shared navbar -->
    <header class="nav container" id="nav">
      <div class="brand"><span class="brand-urban">URBAN</span> <span class="brand-threads">THREADS</span></div>
      <button class="hamburger" id="nav-hamburger" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <nav class="links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="cart.html">Cart <span class="cart-badge" id="cart-badge" aria-hidden="true"></span></a>
      </nav>
      <div class="auth" id="nav-auth"></div>
    </header>

    <main class="container">
      <!-- Filters section -->
      <section>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
          <div class="filters" id="filters">
            <button class="filter-btn active" data-cat="All">All</button>
            <button class="filter-btn" data-cat="Hoodies">Hoodies</button>
            <button class="filter-btn" data-cat="T-shirts">T-shirts</button>
            <button class="filter-btn" data-cat="Sneakers">Sneakers</button>
            <button class="filter-btn" data-cat="Accessories">Accessories</button>
          </div>
          <div>
            <input id="search" placeholder="Search products..." style="padding:8px;border-radius:6px;border:1px solid #e6e6e6;" />
          </div>
        </div>
      </section>

      <!-- Products grid -->
      <section id="products">
        <div class="grid" id="grid"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="brand-footer"><span class="brand-urban">URBAN</span> <span class="brand-threads">THREADS</span>
          <div class="muted">Streetwear for the bold.</div>
        </div>
        <div class="quick-links">
          <a href="index.html">Home</a>
          <a href="shop.html">Shop</a>
          <a href="cart.html">Cart</a>
          <a href="login.html" class="footer__link auth-guest">Login</a>
          <a href="#" class="footer__link auth-user" style="display:none;">Logout</a>
        </div>
        <div class="contact classes">
          <div>support@urbanthreads.co.za</div>
          <div>Cape Town, South Africa</div>
        </div>
      </div>
      <div class="footer-bottom">© 2025 Urban Threads. All rights reserved.</div>
    </footer>

    <div class="mobile-menu" id="mobile-menu">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="cart.html">Cart <span class="mobile-cart-badge"></span></a>
      <a href="login.html" id="mobile-auth-action" class="mobile-menu__link auth-guest">Login</a>
      <a href="#" id="mobile-logout" class="mobile-menu__link auth-user" style="display:none;">Logout</a>
    </div>

    <script type="module">
      import { initAuthUI } from './js/auth.js';
      import { initShop } from './js/shop.js';
      import './js/ui.js';
      // Initialize navbar auth UI and shop logic
      initAuthUI();
      initShop();
    </script>
  </body>
</html>
