<!-- DELETE THIS FILE AFTER RUNNING ONCE. seed.html - One-time product seeder -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Seed Products — Urban Threads</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main class="container" style="padding:40px 0;">
      <h1>DELETE THIS FILE AFTER RUNNING ONCE.</h1>
      <p>This page seeds the Firestore `products` collection with sample data.</p>
      <button id="seed-btn" class="btn">Seed Products</button>
      <p id="seed-result" style="margin-top:12px;"></p>
    </main>

    <script type="module">
      // Import the seed function when the button is clicked to avoid accidental runs
      document.getElementById('seed-btn').addEventListener('click', async () => {
        const { seedProducts } = await import('./js/seed.js');
        const result = await seedProducts();
        document.getElementById('seed-result').textContent = result.message;
      });
    </script>
  </body>
</html>
